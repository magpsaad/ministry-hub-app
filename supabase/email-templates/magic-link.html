<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f5;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border-radius:12px;font-family:Arial,Helvetica,sans-serif;">
      <tr><td align="center" style="padding:32px 32px 8px;">
        <img src="https://youth-ministry-app-prod.vercel.app/brand/ministryhub-icon-192.png" width="64" height="64" alt="" style="display:block;border:0;">
      </td></tr>
      <tr><td align="center" style="padding:0 32px 24px;">
        <img src="https://youth-ministry-app-prod.vercel.app/brand/ministryhub-name.png" width="196" height="35" alt="Ministry Hub" style="display:block;border:0;font-size:24px;font-weight:bold;color:#1e3a5f;">
      </td></tr>
      <tr><td style="padding:0 32px 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td style="font-size:20px;font-weight:bold;color:#222222;padding:0 0 12px;">Your sign-in code</td></tr>
          <tr><td style="font-size:15px;line-height:1.6;color:#333333;padding:0 0 20px;">Enter this code in Ministry Hub to sign in. It expires shortly and can be used only once.</td></tr>
          <tr><td align="center" style="padding:4px 0 24px;">
            <div style="display:inline-block;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:bold;letter-spacing:8px;color:#1e3a5f;background:#f1f4f8;border-radius:8px;padding:12px 20px;">{{ .Token }}</div>
          </td></tr>
          <tr><td style="font-size:14px;line-height:1.6;color:#555555;padding:0 0 8px;">Never share this code with anyone. Ministry Hub will never ask you for it.</td></tr>
        </table>
      </td></tr>
      <tr><td style="padding:16px 32px 28px;border-top:1px solid #eeeeee;font-size:12px;line-height:1.5;color:#888888;">
        If you didn&rsquo;t ask for this, you can safely ignore this email &mdash; nothing will change.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
